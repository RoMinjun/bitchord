name: Listen Together Test APK

on:
  push:
    branches: [test/listen-together-playlist-refill]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER || 'https://bitchord-listen-together.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the dev signing key when available
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$DEBUG_KEYSTORE_BASE64" ] || exit 0
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build the dev APK
        run: ./gradlew :app:assembleDevDebug --no-daemon

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-listen-together-refill-test
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error

      - name: Shared playlist regression tests
        run: ./gradlew :shared:jvmTest --tests 'com.music.bitchord.playback.PartyPlaybackQueueTest' --tests 'com.music.bitchord.data.listentogether.PartyPlaylistContinuationTest' --no-daemon

      - name: Android party queue regression tests
        run: >-
          ./gradlew :app:testDevDebugUnitTest
          --tests 'com.music.bitchord.DetailScreenQueueTest'
          --tests 'com.music.bitchord.QueueCoordinatorTest'
          --tests 'com.music.bitchord.playback.PartyQueueMoveTest'
          --tests 'com.music.bitchord.playback.PartyAutoplayTest'
          --tests 'com.music.bitchord.playback.PartyAutomaticTransitionTest'
          --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listen-together-test-reports
          path: |
            app/build/reports/tests/
            shared/build/reports/tests/
